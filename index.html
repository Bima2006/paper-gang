<!DOCTYPE html>
<html lang="si" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Gang Pro | Educational PDF Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s; }
        .dark body { background-color: #1a1a1a; color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(31, 41, 55, 0.85); }
        .pdf-frame { width: 100%; height: calc(100vh - 180px); border: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#F5F5F7] text-gray-800">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="w-64 glass border-r border-gray-200 dark:border-gray-700 flex flex-col z-20">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-blue-600 dark:text-blue-400 tracking-tight">PAPER GANG</h1>
                <p class="text-[10px] text-gray-500 uppercase mt-1">Professional Edition</p>
            </div>
            
            <nav class="flex-1 overflow-y-auto px-4 space-y-8 custom-scrollbar">
                <div>
                    <h3 class="text-[10px] font-bold text-gray-400 uppercase mb-3 px-2">Subjects</h3>
                    <div id="subject-list" class="space-y-1"></div>
                </div>
                <div>
                    <h3 class="text-[10px] font-bold text-gray-400 uppercase mb-3 px-2">Resources</h3>
                    <div id="resource-list" class="space-y-2"></div>
                </div>
            </nav>

            <div class="p-4 border-t border-gray-200 dark:border-gray-700">
                <button onclick="toggleAdminModal(true)" class="text-xs font-semibold text-gray-500 hover:text-blue-500 flex items-center justify-center gap-2 w-full py-2 bg-gray-100 dark:bg-gray-800 rounded-lg transition">
                    ⚙️ Admin Panel
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 glass border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-8 z-10">
                <h2 id="current-view-title" class="text-lg font-bold">Library</h2>
                <div class="flex items-center gap-4">
                    <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                        <span id="theme-icon">🌙</span>
                    </button>
                </div>
            </header>

            <div id="tab-container" class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 flex items-center px-4 overflow-x-auto no-scrollbar h-12 gap-1">
                <button onclick="showLibrary()" id="library-tab" class="px-4 h-full flex items-center gap-2 text-xs font-bold border-b-2 border-blue-500 text-blue-500 whitespace-nowrap">🏠 LIBRARY</button>
            </div>

            <div id="viewport" class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                <div id="library-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 animate__animated animate__fadeIn"></div>
                <div id="pdf-viewer-container" class="hidden h-full rounded-xl overflow-hidden shadow-2xl bg-white dark:bg-gray-800"></div>
            </div>

            <footer class="h-10 glass border-t border-gray-200 dark:border-gray-700 flex items-center justify-center text-[10px] text-gray-400 uppercase tracking-widest">
                Developed by BiMaA (BHAWATHRA)
            </footer>
        </main>
    </div>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-gray-800 w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden animate__animated animate__fadeInDown">
            <div id="admin-auth" class="p-10 text-center">
                <h3 class="text-xl font-bold mb-6">Admin Login</h3>
                <input type="password" id="admin-pass-input" placeholder="Password" class="w-full p-3 rounded-xl border mb-4 text-center dark:bg-gray-700">
                <div class="flex gap-2">
                    <button onclick="toggleAdminModal(false)" class="flex-1 py-3 bg-gray-100 dark:bg-gray-700 rounded-xl">Cancel</button>
                    <button onclick="checkAdminPass()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl">Unlock</button>
                </div>
            </div>

            <div id="admin-main" class="hidden">
                <div class="flex border-b dark:border-gray-700">
                    <button onclick="switchAdminTab('sub')" id="atab-sub" class="flex-1 py-3 text-xs font-bold border-b-2 border-blue-500 text-blue-500">SUBJECTS</button>
                    <button onclick="switchAdminTab('pdf')" id="atab-pdf" class="flex-1 py-3 text-xs font-bold text-gray-400">PDFS</button>
                    <button onclick="switchAdminTab('lnk')" id="atab-lnk" class="flex-1 py-3 text-xs font-bold text-gray-400">LINKS</button>
                </div>
                <div class="p-6 max-h-[60vh] overflow-y-auto custom-scrollbar">
                    <div id="aview-sub" class="space-y-4">
                        <div class="flex gap-2"><input type="text" id="new-sub-name" placeholder="Subject Name" class="flex-1 p-2 border rounded dark:bg-gray-700"><button onclick="addSubject()" class="bg-green-600 text-white px-4 rounded">+</button></div>
                        <div id="admin-sub-list" class="space-y-2"></div>
                    </div>
                    <div id="aview-pdf" class="hidden space-y-4">
                        <input type="text" id="new-pdf-title" placeholder="PDF Title" class="w-full p-2 border rounded dark:bg-gray-700">
                        <select id="new-pdf-sub" class="w-full p-2 border rounded dark:bg-gray-700"></select>
                        <input type="text" id="new-pdf-url" placeholder="PDF URL (Drive Preview)" class="w-full p-2 border rounded dark:bg-gray-700">
                        <button onclick="addPDF()" class="w-full bg-blue-600 text-white py-2 rounded">Add PDF</button>
                        <div id="admin-pdf-list" class="space-y-2"></div>
                    </div>
                    <div id="aview-lnk" class="hidden space-y-4">
                        <div class="grid grid-cols-2 gap-2"><input type="text" id="new-link-title" placeholder="Label"><input type="text" id="new-link-url" placeholder="URL"></div>
                        <button onclick="addLink()" class="w-full bg-indigo-600 text-white py-2 rounded">Add Link</button>
                        <div id="admin-link-list" class="space-y-2"></div>
                    </div>
                </div>
                <div class="p-4 bg-gray-50 dark:bg-gray-900 text-right"><button onclick="toggleAdminModal(false)" class="text-xs font-bold text-gray-500">CLOSE</button></div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            subjects: JSON.parse(localStorage.getItem('pg_sub')) || ['Physics', 'Chemistry'],
            pdfs: JSON.parse(localStorage.getItem('pg_pdf')) || [],
            links: JSON.parse(localStorage.getItem('pg_lnk')) || [],
            activeCategory: 'All',
            openTabs: [],
            activeTabId: 'library',
            isDark: localStorage.getItem('pg_dark') === 'true'
        };

        const ADMIN_PASS = "1234";

        window.onload = () => {
            if (state.isDark) document.documentElement.classList.add('dark');
            renderAll();
        };

        function renderAll() {
            renderSidebar();
            renderLibrary();
            renderResources();
            updateTabs();
        }

        function renderSidebar() {
            const list = document.getElementById('subject-list');
            list.innerHTML = `<button onclick="setCategory('All')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold ${state.activeCategory === 'All' ? 'bg-blue-100 text-blue-600 dark:bg-blue-900/30' : ''}">📚 View All</button>`;
            state.subjects.forEach(s => {
                list.innerHTML += `<button onclick="setCategory('${s}')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold ${state.activeCategory === s ? 'bg-blue-100 text-blue-600 dark:bg-blue-900/30' : 'hover:bg-gray-100 dark:hover:bg-gray-800'}">📄 ${s.toUpperCase()}</button>`;
            });
            document.getElementById('new-pdf-sub').innerHTML = state.subjects.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function renderResources() {
            document.getElementById('resource-list').innerHTML = state.links.map(l => `<a href="${l.url}" target="_blank" class="flex items-center gap-2 px-3 py-1 text-xs text-gray-500 hover:text-blue-500">🔗 ${l.title}</a>`).join('');
        }

        function renderLibrary() {
            const grid = document.getElementById('library-grid');
            const filtered = state.activeCategory === 'All' ? state.pdfs : state.pdfs.filter(p => p.subject === state.activeCategory);
            grid.innerHTML = filtered.length ? filtered.map(pdf => `
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 border border-gray-200 dark:border-gray-700 shadow-sm hover:shadow-md transition">
                    <div class="h-20 bg-gray-50 dark:bg-gray-900 rounded-xl mb-4 flex items-center justify-center text-3xl">📄</div>
                    <h4 class="font-bold text-sm truncate">${pdf.title}</h4>
                    <p class="text-[10px] text-blue-500 font-bold mt-1 mb-4 uppercase">${pdf.subject}</p>
                    <button onclick="openPDF('${pdf.id}')" class="w-full py-2 bg-blue-600 text-white rounded-lg text-xs font-bold shadow-lg shadow-blue-500/20">OPEN READER</button>
                </div>
            `).join('') : `<div class="col-span-full py-20 text-center text-gray-400 text-sm">No files found.</div>`;
        }

        window.setCategory = (c) => { state.activeCategory = c; document.getElementById('current-view-title').innerText = c; showLibrary(); renderSidebar(); renderLibrary(); };
        
        window.openPDF = (id) => {
            const pdf = state.pdfs.find(p => p.id === id);
            if (!pdf) return;
            if (!state.openTabs.find(t => t.id === id)) state.openTabs.push(pdf);
            state.activeTabId = id;
            updateTabs();
            renderViewer(pdf.url);
        };

        window.updateTabs = () => {
            const container = document.getElementById('tab-container');
            container.querySelectorAll('.dynamic-tab').forEach(t => t.remove());
            document.getElementById('library-tab').className = `px-4 h-full flex items-center gap-2 text-[10px] font-bold border-b-2 whitespace-nowrap ${state.activeTabId === 'library' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-400'}`;
            state.openTabs.forEach(t => {
                const el = document.createElement('div');
                el.className = `dynamic-tab px-4 h-full flex items-center gap-2 text-[10px] font-bold border-b-2 cursor-pointer group ${state.activeTabId === t.id ? 'border-blue-500 text-blue-600 bg-blue-50/50' : 'border-transparent text-gray-400'}`;
                el.innerHTML = `<span onclick="openPDF('${t.id}')">${t.title.toUpperCase()}</span><span onclick="closeTab(event, '${t.id}')" class="ml-2 hover:text-red-500">✕</span>`;
                container.appendChild(el);
            });
        };

        window.closeTab = (e, id) => { e.stopPropagation(); state.openTabs = state.openTabs.filter(t => t.id !== id); if (state.activeTabId === id) showLibrary(); else updateTabs(); };
        window.showLibrary = () => { state.activeTabId = 'library'; document.getElementById('library-grid').classList.remove('hidden'); document.getElementById('pdf-viewer-container').classList.add('hidden'); updateTabs(); };
        function renderViewer(u) { document.getElementById('library-grid').classList.add('hidden'); const v = document.getElementById('pdf-viewer-container'); v.classList.remove('hidden'); v.innerHTML = `<iframe src="${u}" class="pdf-frame"></iframe>`; }

        // ADMIN FUNCTIONS
        window.toggleAdminModal = (s) => { document.getElementById('admin-modal').style.display = s ? 'flex' : 'none'; document.getElementById('admin-auth').classList.remove('hidden'); document.getElementById('admin-main').classList.add('hidden'); };
        window.checkAdminPass = () => { if (document.getElementById('admin-pass-input').value === ADMIN_PASS) { document.getElementById('admin-auth').classList.add('hidden'); document.getElementById('admin-main').classList.remove('hidden'); refreshAdmin(); } };
        window.switchAdminTab = (t) => { ['sub', 'pdf', 'lnk'].forEach(v => { document.getElementById(`aview-${v}`).classList.add('hidden'); document.getElementById(`atab-${v}`).className = "flex-1 py-3 text-[10px] font-bold text-gray-400"; }); document.getElementById(`aview-${t}`).classList.remove('hidden'); document.getElementById(`atab-${t}`).className = "flex-1 py-3 text-[10px] font-bold border-b-2 border-blue-500 text-blue-600"; };

        function refreshAdmin() {
            document.getElementById('admin-sub-list').innerHTML = state.subjects.map(s => `<div class="flex justify-between p-2 bg-gray-50 dark:bg-gray-900 rounded text-xs"><span>${s}</span><button onclick="delSub('${s}')" class="text-red-500">Delete</button></div>`).join('');
            document.getElementById('admin-pdf-list').innerHTML = state.pdfs.map(p => `<div class="flex justify-between p-2 bg-gray-50 dark:bg-gray-900 rounded text-xs"><span>${p.title}</span><button onclick="delPDF('${p.id}')" class="text-red-500">Delete</button></div>`).join('');
            document.getElementById('admin-link-list').innerHTML = state.links.map(l => `<div class="flex justify-between p-2 bg-gray-50 dark:bg-gray-900 rounded text-xs"><span>${l.title}</span><button onclick="delLnk('${l.title}')" class="text-red-500">Delete</button></div>`).join('');
            renderAll();
        }

        window.addSubject = () => { const n = document.getElementById('new-sub-name').value; if(n){ state.subjects.push(n); save(); refreshAdmin(); document.getElementById('new-sub-name').value=''; } };
        window.delSub = (n) => { state.subjects = state.subjects.filter(s => s !== n); save(); refreshAdmin(); };
        window.addPDF = () => { const t = document.getElementById('new-pdf-title').value, s = document.getElementById('new-pdf-sub').value, u = document.getElementById('new-pdf-url').value; if(t && u){ state.pdfs.push({id:'p'+Date.now(), title:t, subject:s, url:u}); save(); refreshAdmin(); } };
        window.delPDF = (id) => { state.pdfs = state.pdfs.filter(p => p.id !== id); save(); refreshAdmin(); };
        window.addLink = () => { const t = document.getElementById('new-link-title').value, u = document.getElementById('new-link-url').value; if(t && u){ state.links.push({title:t, url:u}); save(); refreshAdmin(); } };
        window.delLnk = (t) => { state.links = state.links.filter(l => l.title !== t); save(); refreshAdmin(); };

        function save() { localStorage.setItem('pg_sub', JSON.stringify(state.subjects)); localStorage.setItem('pg_pdf', JSON.stringify(state.pdfs)); localStorage.setItem('pg_lnk', JSON.stringify(state.links)); }
        window.toggleDarkMode = () => { state.isDark = !state.isDark; document.documentElement.classList.toggle('dark'); localStorage.setItem('pg_dark', state.isDark); document.getElementById('theme-icon').innerText = state.isDark ? '☀️' : '🌙'; };
    </script>
</body>
</html>
