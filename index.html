<!DOCTYPE html>
<html lang="si" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Gang Pro | Educational PDF Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s; }
        .dark body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .dark .glass { background: rgba(30, 41, 59, 0.8); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .pdf-frame { width: 100%; height: calc(100vh - 120px); border: none; border-radius: 12px; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .card-gradient { background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%); }
        .dark .card-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="w-64 glass border-r border-slate-200 dark:border-slate-800 flex flex-col z-20 hidden md:flex">
            <div class="p-8">
                <h1 class="text-2xl font-black text-blue-600 dark:text-blue-400 tracking-tighter italic">PAPER GANG</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase mt-1 tracking-widest">Professional Edition</p>
            </div>
            
            <nav class="flex-1 overflow-y-auto px-4 space-y-8 custom-scrollbar">
                <div>
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-4 px-2 tracking-widest">Navigation</h3>
                    <div id="subject-list" class="space-y-1">
                        <!-- Subjects will be injected here -->
                    </div>
                </div>
                
                <div>
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-4 px-2 tracking-widest">Quick Links</h3>
                    <div id="resource-list" class="space-y-1">
                        <!-- Links will be injected here -->
                    </div>
                </div>
            </nav>

            <div class="p-6">
                <button onclick="toggleAdminModal(true)" class="group flex items-center justify-center gap-3 w-full py-3 bg-slate-100 dark:bg-slate-800 hover:bg-blue-600 hover:text-white rounded-xl transition-all duration-300 shadow-sm">
                    <span class="text-sm font-bold">Admin Console</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="h-20 glass flex items-center justify-between px-8 z-10">
                <div class="flex items-center gap-4">
                    <button class="md:hidden p-2 bg-slate-100 rounded-lg">☰</button>
                    <div>
                        <h2 id="current-view-title" class="text-xl font-black text-slate-800 dark:text-white">Main Library</h2>
                        <p class="text-[10px] text-blue-500 font-bold uppercase tracking-widest">Available Resources</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 transition hover:scale-110">
                        <span id="theme-icon" class="text-lg">🌙</span>
                    </button>
                    <div class="h-10 w-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-lg shadow-blue-500/30">BA</div>
                </div>
            </header>

            <!-- Tabs -->
            <div id="tab-container" class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center px-4 overflow-x-auto no-scrollbar h-14 gap-2">
                <button onclick="showLibrary()" id="library-tab" class="px-6 h-full flex items-center gap-2 text-xs font-black border-b-4 border-blue-500 text-blue-600 whitespace-nowrap transition-all">
                    <span class="opacity-50">00</span> EXPLORE
                </button>
                <!-- Dynamic tabs here -->
            </div>

            <!-- Viewport -->
            <div id="viewport" class="flex-1 overflow-y-auto p-6 md:p-10 custom-scrollbar">
                <div id="library-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 animate__animated animate__fadeIn">
                    <!-- Cards will be injected here -->
                </div>
                
                <div id="pdf-viewer-container" class="hidden h-full animate__animated animate__zoomIn">
                    <div class="bg-white dark:bg-slate-800 p-2 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 h-full">
                        <div id="viewer-placeholder" class="h-full"></div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="h-12 glass flex items-center justify-between px-8 text-[9px] text-slate-400 font-bold uppercase tracking-[0.2em]">
                <span>&copy; 2024 PAPER GANG PRO</span>
                <span class="text-blue-500">Developed by BiMaA (BHAWATHRA)</span>
            </footer>
        </main>
    </div>

    <!-- MODALS -->
    <div id="admin-modal" class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-50 p-4 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-800 w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate__animated animate__fadeInUp">
            
            <div id="admin-auth" class="p-12 text-center">
                <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-6">🔒</div>
                <h3 class="text-2xl font-black mb-2">Restricted Access</h3>
                <p class="text-slate-400 text-sm mb-8">Please enter the administrator password to manage the database.</p>
                
                <input type="password" id="admin-pass-input" placeholder="••••" class="w-full max-w-xs p-4 rounded-2xl border-2 border-slate-100 dark:border-slate-700 mb-6 text-center text-xl font-bold dark:bg-slate-900 focus:border-blue-500 outline-none transition-all">
                
                <div class="flex gap-3 justify-center">
                    <button onclick="toggleAdminModal(false)" class="px-8 py-3 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold text-sm">Cancel</button>
                    <button onclick="checkAdminPass()" class="px-8 py-3 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30 hover:scale-105 transition">Unlock</button>
                </div>
            </div>

            <div id="admin-main" class="hidden">
                <div class="flex border-b dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50">
                    <button onclick="switchAdminTab('sub')" id="atab-sub" class="flex-1 py-4 text-[10px] font-black border-b-4 border-blue-500 text-blue-600 tracking-widest">SUBJECTS</button>
                    <button onclick="switchAdminTab('pdf')" id="atab-pdf" class="flex-1 py-4 text-[10px] font-black text-slate-400 tracking-widest">PDF CONTENT</button>
                    <button onclick="switchAdminTab('lnk')" id="atab-lnk" class="flex-1 py-4 text-[10px] font-black text-slate-400 tracking-widest">RESOURCES</button>
                </div>
                
                <div class="p-8 max-h-[60vh] overflow-y-auto custom-scrollbar">
                    <div id="aview-sub" class="space-y-6">
                        <div class="flex gap-2">
                            <input type="text" id="new-sub-name" placeholder="Subject Name" class="flex-1 p-3 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                            <button onclick="addSubject()" class="bg-blue-600 text-white px-6 rounded-xl font-bold">+</button>
                        </div>
                        <div id="admin-sub-list" class="space-y-2"></div>
                    </div>

                    <div id="aview-pdf" class="hidden space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="new-pdf-title" placeholder="Document Title" class="p-3 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                            <select id="new-pdf-sub" class="p-3 border rounded-xl dark:bg-slate-900 dark:border-slate-700"></select>
                        </div>
                        <input type="text" id="new-pdf-url" placeholder="Direct Google Drive / PDF Link" class="w-full p-3 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                        <button onclick="addPDF()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg">Upload to Library</button>
                        <div id="admin-pdf-list" class="space-y-2 mt-6"></div>
                    </div>

                    <div id="aview-lnk" class="hidden space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="new-link-title" placeholder="Resource Name" class="p-3 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                            <input type="text" id="new-link-url" placeholder="URL" class="p-3 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                        </div>
                        <button onclick="addLink()" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold">Add External Link</button>
                        <div id="admin-link-list" class="space-y-2 mt-6"></div>
                    </div>
                </div>
                
                <div class="p-6 bg-slate-50 dark:bg-slate-900 flex justify-end">
                    <button onclick="toggleAdminModal(false)" class="text-xs font-black text-slate-400 hover:text-red-500 tracking-widest">CLOSE PANEL</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            subjects: JSON.parse(localStorage.getItem('pg_sub')) || ['Physics', 'Chemistry', 'Mathematics', 'Biology'],
            pdfs: JSON.parse(localStorage.getItem('pg_pdf')) || [
                {id: 'demo1', title: 'Unit 01: Measurements', subject: 'Physics', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'},
                {id: 'demo2', title: 'Atomic Structure', subject: 'Chemistry', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'}
            ],
            links: JSON.parse(localStorage.getItem('pg_lnk')) || [{title: 'Official Website', url: '#'}],
            activeCategory: 'All',
            openTabs: [],
            activeTabId: 'library',
            isDark: localStorage.getItem('pg_dark') === 'true'
        };

        const ADMIN_PASS = "1234";

        window.onload = () => {
            if (state.isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerText = '☀️';
            }
            renderAll();
        };

        function save() {
            localStorage.setItem('pg_sub', JSON.stringify(state.subjects));
            localStorage.setItem('pg_pdf', JSON.stringify(state.pdfs));
            localStorage.setItem('pg_lnk', JSON.stringify(state.links));
            localStorage.setItem('pg_dark', state.isDark);
        }

        function renderAll() {
            renderSidebar();
            renderLibrary();
            renderResources();
            updateTabs();
        }

        function renderSidebar() {
            const list = document.getElementById('subject-list');
            list.innerHTML = `
                <button onclick="setCategory('All')" class="w-full text-left px-4 py-3 rounded-xl text-[11px] font-black tracking-widest transition-all ${state.activeCategory === 'All' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/40' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                    ALL COLLECTIONS
                </button>
            `;
            state.subjects.forEach(s => {
                list.innerHTML += `
                    <button onclick="setCategory('${s}')" class="w-full text-left px-4 py-3 rounded-xl text-[11px] font-black tracking-widest transition-all ${state.activeCategory === s ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/40' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                        ${s.toUpperCase()}
                    </button>
                `;
            });
            document.getElementById('new-pdf-sub').innerHTML = state.subjects.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function renderResources() {
            document.getElementById('resource-list').innerHTML = state.links.map(l => `
                <a href="${l.url}" target="_blank" class="flex items-center gap-3 px-4 py-2 text-[10px] font-bold text-slate-400 hover:text-blue-500 transition-colors uppercase tracking-widest">
                    <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span> ${l.title}
                </a>
            `).join('');
        }

        function renderLibrary() {
            const grid = document.getElementById('library-grid');
            const filtered = state.activeCategory === 'All' ? state.pdfs : state.pdfs.filter(p => p.subject === state.activeCategory);
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center opacity-30 font-black tracking-widest uppercase">No Records Found</div>`;
                return;
            }

            grid.innerHTML = filtered.map(pdf => `
                <div class="card-gradient group rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                    <div class="w-12 h-12 bg-white dark:bg-slate-900 rounded-2xl mb-6 flex items-center justify-center text-2xl shadow-sm group-hover:scale-110 transition">📄</div>
                    <h4 class="font-black text-sm mb-1 leading-tight group-hover:text-blue-600 transition">${pdf.title}</h4>
                    <p class="text-[9px] text-blue-500 font-black uppercase tracking-widest mb-6">${pdf.subject}</p>
                    <button onclick="openPDF('${pdf.id}')" class="w-full py-3 bg-slate-900 dark:bg-blue-600 text-white rounded-xl text-[10px] font-black tracking-widest shadow-lg hover:opacity-90 active:scale-95 transition">READ NOW</button>
                </div>
            `).join('');
        }

        window.setCategory = (c) => { 
            state.activeCategory = c; 
            document.getElementById('current-view-title').innerText = c === 'All' ? 'Main Library' : c; 
            showLibrary(); 
            renderSidebar(); 
            renderLibrary(); 
        };
        
        window.openPDF = (id) => {
            const pdf = state.pdfs.find(p => p.id === id);
            if (!pdf) return;
            if (!state.openTabs.find(t => t.id === id)) state.openTabs.push(pdf);
            state.activeTabId = id;
            updateTabs();
            renderViewer(pdf.url, pdf.title);
        };

        window.updateTabs = () => {
            const container = document.getElementById('tab-container');
            container.querySelectorAll('.dynamic-tab').forEach(t => t.remove());
            
            const libTab = document.getElementById('library-tab');
            libTab.className = `px-6 h-full flex items-center gap-2 text-[10px] font-black border-b-4 transition-all whitespace-nowrap ${state.activeTabId === 'library' ? 'border-blue-500 text-blue-600 bg-blue-50/10' : 'border-transparent text-slate-400 opacity-50 hover:opacity-100'}`;

            state.openTabs.forEach(t => {
                const el = document.createElement('div');
                el.className = `dynamic-tab px-6 h-full flex items-center gap-3 text-[10px] font-black border-b-4 cursor-pointer transition-all whitespace-nowrap group ${state.activeTabId === t.id ? 'border-blue-500 text-blue-600 bg-blue-50/10' : 'border-transparent text-slate-400 opacity-50 hover:opacity-100'}`;
                el.innerHTML = `
                    <span onclick="openPDF('${t.id}')">${t.title.toUpperCase()}</span>
                    <span onclick="closeTab(event, '${t.id}')" class="text-xs hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">✕</span>
                `;
                container.appendChild(el);
            });
        };

        window.closeTab = (e, id) => { 
            e.stopPropagation(); 
            state.openTabs = state.openTabs.filter(t => t.id !== id); 
            if (state.activeTabId === id) showLibrary(); 
            else updateTabs(); 
        };

        window.showLibrary = () => { 
            state.activeTabId = 'library'; 
            document.getElementById('library-grid').classList.remove('hidden'); 
            document.getElementById('pdf-viewer-container').classList.add('hidden'); 
            updateTabs(); 
        };

        function renderViewer(u, title) { 
            document.getElementById('library-grid').classList.add('hidden'); 
            const v = document.getElementById('pdf-viewer-container'); 
            v.classList.remove('hidden'); 
            document.getElementById('viewer-placeholder').innerHTML = `<iframe src="${u}" class="pdf-frame"></iframe>`; 
        }

        // ADMIN LOGIC
        window.toggleAdminModal = (s) => { 
            document.getElementById('admin-modal').style.display = s ? 'flex' : 'none'; 
            document.getElementById('admin-auth').classList.remove('hidden'); 
            document.getElementById('admin-main').classList.add('hidden'); 
            document.getElementById('admin-pass-input').value = '';
        };

        window.checkAdminPass = () => { 
            if (document.getElementById('admin-pass-input').value === ADMIN_PASS) { 
                document.getElementById('admin-auth').classList.add('hidden'); 
                document.getElementById('admin-main').classList.remove('hidden'); 
                refreshAdmin(); 
            } else {
                alert("Incorrect Password!");
            }
        };

        window.switchAdminTab = (t) => { 
            ['sub', 'pdf', 'lnk'].forEach(v => { 
                document.getElementById(`aview-${v}`).classList.add('hidden'); 
                document.getElementById(`atab-${v}`).className = "flex-1 py-4 text-[10px] font-black text-slate-400 tracking-widest"; 
            }); 
            document.getElementById(`aview-${t}`).classList.remove('hidden'); 
            document.getElementById(`atab-${t}`).className = "flex-1 py-4 text-[10px] font-black border-b-4 border-blue-500 text-blue-600 tracking-widest"; 
        };

        function refreshAdmin() {
            document.getElementById('admin-sub-list').innerHTML = state.subjects.map(s => `
                <div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-100 dark:border-slate-800">
                    <span class="text-xs font-bold">${s}</span>
                    <button onclick="delSub('${s}')" class="text-[10px] font-black text-red-500 hover:underline">REMOVE</button>
                </div>
            `).join('');
            
            document.getElementById('admin-pdf-list').innerHTML = state.pdfs.map(p => `
                <div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-100 dark:border-slate-800">
                    <div class="flex flex-col">
                        <span class="text-xs font-bold">${p.title}</span>
                        <span class="text-[8px] text-blue-500 font-bold uppercase">${p.subject}</span>
                    </div>
                    <button onclick="delPDF('${p.id}')" class="text-[10px] font-black text-red-500 hover:underline">DELETE</button>
                </div>
            `).join('');

            document.getElementById('admin-link-list').innerHTML = state.links.map(l => `
                <div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-100 dark:border-slate-800">
                    <span class="text-xs font-bold">${l.title}</span>
                    <button onclick="delLnk('${l.title}')" class="text-[10px] font-black text-red-500 hover:underline">REMOVE</button>
                </div>
            `).join('');
            renderAll();
        }

        window.addSubject = () => { 
            const n = document.getElementById('new-sub-name').value.trim(); 
            if(n){ state.subjects.push(n); save(); refreshAdmin(); document.getElementById('new-sub-name').value=''; } 
        };
        
        window.delSub = (n) => { 
            state.subjects = state.subjects.filter(s => s !== n); 
            state.pdfs = state.pdfs.filter(p => p.subject !== n);
            save(); 
            refreshAdmin(); 
        };

        window.addPDF = () => { 
            const t = document.getElementById('new-pdf-title').value.trim();
            const s = document.getElementById('new-pdf-sub').value;
            const u = document.getElementById('new-pdf-url').value.trim();
            if(t && u){ 
                state.pdfs.push({id:'p'+Date.now(), title:t, subject:s, url:u}); 
                save(); refreshAdmin(); 
                document.getElementById('new-pdf-title').value = '';
                document.getElementById('new-pdf-url').value = '';
            } 
        };

        window.delPDF = (id) => { 
            state.pdfs = state.pdfs.filter(p => p.id !== id); 
            save(); refreshAdmin(); 
        };

        window.addLink = () => { 
            const t = document.getElementById('new-link-title').value.trim();
            const u = document.getElementById('new-link-url').value.trim();
            if(t && u){ 
                state.links.push({title:t, url:u}); 
                save(); refreshAdmin(); 
                document.getElementById('new-link-title').value = '';
                document.getElementById('new-link-url').value = '';
            } 
        };

        window.delLnk = (t) => { 
            state.links = state.links.filter(l => l.title !== t); 
            save(); refreshAdmin(); 
        };

        window.toggleDarkMode = () => { 
            state.isDark = !state.isDark; 
            document.documentElement.classList.toggle('dark'); 
            save();
            document.getElementById('theme-icon').innerText = state.isDark ? '☀️' : '🌙'; 
        };
    </script>
</body>
</html>
