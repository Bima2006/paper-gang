<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Gang Pro - BHAWATHRA</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        :root {
            --primary: #6366f1;
            --bg-light: #f8fafc;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .dark {
            --bg-light: #0f172a;
            --glass: rgba(30, 41, 59, 0.8);
            background-color: #0f172a;
            color: #f1f5f9;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-active {
            border-bottom: 3px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-item {
            transition: all 0.2s;
            border-radius: 12px;
        }

        .sidebar-item:hover {
            background: var(--primary);
            color: white;
            padding-left: 1.25rem;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 180px);
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    
    <!-- Connection Status Banner -->
    <div id="status-bar" class="hidden bg-amber-500 text-white text-[10px] py-1 text-center font-bold uppercase tracking-widest z-[100]">
        Connecting to Firebase...
    </div>

    <div class="flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <header class="h-20 glass-panel flex items-center justify-between px-8 shadow-sm z-50">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">
                    <i class="fas fa-book-open"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Paper <span class="text-indigo-600">Gang Pro</span></h1>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button onclick="openAdmin()" class="bg-slate-900 dark:bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-lg hover:opacity-90 transition">
                    <i class="fas fa-lock mr-2"></i>Admin
                </button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-72 glass-panel border-r hidden md:flex flex-col p-6 overflow-y-auto">
                <div class="mb-10">
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-4">Study Folders</h3>
                    <nav id="subjectList" class="space-y-1">
                        <!-- Dynamic Subjects will load here -->
                    </nav>
                </div>

                <div class="mb-6">
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-4">Edu Resources</h3>
                    <nav id="resourceList" class="space-y-1">
                        <!-- Dynamic Links will load here -->
                    </nav>
                </div>
            </aside>

            <!-- Main Workspace -->
            <main class="flex-1 flex flex-col bg-transparent overflow-hidden">
                <!-- Tabs System -->
                <div class="px-6 pt-4 flex items-center gap-2 border-b bg-white/50 dark:bg-slate-900/50 overflow-x-auto no-scrollbar">
                    <button id="tab-home" onclick="showLibrary()" class="px-6 py-3 text-sm whitespace-nowrap tab-active transition">
                        <i class="fas fa-th-large mr-2"></i>Library
                    </button>
                    <div id="activeTabs" class="flex gap-2"></div>
                </div>

                <!-- Content Area -->
                <div id="mainDisplay" class="flex-1 p-6 overflow-y-auto">
                    <!-- Library View -->
                    <div id="libraryView" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 animate-in fade-in duration-500">
                        <!-- PDF Cards will load here -->
                    </div>
                    
                    <!-- PDF Reader View -->
                    <div id="readerView" class="hidden h-full">
                        <iframe id="pdfFrame" src=""></iframe>
                    </div>
                </div>
            </main>
        </div>

        <!-- Footer -->
        <footer class="h-10 glass-panel border-t flex items-center justify-center text-[11px] text-slate-400 uppercase tracking-widest">
            Developed by <span class="text-indigo-500 font-bold ml-1">BiMaA (BHAWATHRA)</span>
        </footer>
    </div>

    <!-- Admin Panel Overlay -->
    <div id="adminOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[100] items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in duration-200">
            <div class="p-6 border-b flex justify-between items-center">
                <h2 class="text-xl font-bold">Authorized Access</h2>
                <button onclick="closeAdmin()" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center">&times;</button>
            </div>

            <!-- Login Section -->
            <div id="adminLogin" class="p-8 text-center">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <p class="text-slate-500 text-sm mb-6">Enter administrative credentials to manage papers.</p>
                <input type="password" id="adminKey" placeholder="••••" class="w-full text-center text-2xl tracking-[1em] p-4 border rounded-2xl mb-4 dark:bg-slate-700">
                <button onclick="authAdmin()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition">Unlock Panel</button>
            </div>

            <!-- Management Section -->
            <div id="adminConsole" class="hidden p-6 space-y-6 overflow-y-auto max-h-[70vh]">
                <!-- Manage Subjects -->
                <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-2xl">
                    <h4 class="text-sm font-bold mb-3 uppercase text-slate-400">Add Subject</h4>
                    <div class="flex gap-2">
                        <input type="text" id="subInput" placeholder="Ex: Biology" class="flex-1 p-2.5 rounded-xl border dark:bg-slate-700">
                        <button onclick="saveSubject()" class="bg-green-600 text-white px-4 rounded-xl"><i class="fas fa-plus"></i></button>
                    </div>
                </div>

                <!-- Upload PDF -->
                <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-2xl">
                    <h4 class="text-sm font-bold mb-3 uppercase text-slate-400">Upload New Paper</h4>
                    <div class="space-y-3">
                        <input type="text" id="pdfName" placeholder="Paper Title" class="w-full p-2.5 rounded-xl border dark:bg-slate-700">
                        <input type="text" id="pdfLink" placeholder="Google Drive Preview URL" class="w-full p-2.5 rounded-xl border dark:bg-slate-700">
                        <select id="subSelect" class="w-full p-2.5 rounded-xl border dark:bg-slate-700"></select>
                        <button onclick="savePDF()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">Add to Library</button>
                    </div>
                </div>

                <!-- Add Links -->
                <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-2xl">
                    <h4 class="text-sm font-bold mb-3 uppercase text-slate-400">External Links</h4>
                    <div class="space-y-3">
                        <input type="text" id="resName" placeholder="Name (e.g. Telegram Group)" class="w-full p-2.5 rounded-xl border dark:bg-slate-700">
                        <input type="text" id="resUrl" placeholder="https://..." class="w-full p-2.5 rounded-xl border dark:bg-slate-700">
                        <button onclick="saveResource()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">Add Resource</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBgE744u_LDsaKh906PX8aKFtinseYc_FM",
            authDomain: "paper-gang-84247.firebaseapp.com",
            projectId: "paper-gang-84247",
            storageBucket: "paper-gang-84247.firebasestorage.app",
            messagingSenderId: "1021399907004",
            appId: "1:1021399907004:web:06481f2cd32e7470d6aeb9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const ADMIN_PWD = "1234";

        let currentCategory = "All";
        let openTabs = [];

        // --- THEME ---
        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('pg_dark_mode', isDark);
        }

        // --- ADMIN ---
        function openAdmin() { document.getElementById('adminOverlay').style.display = 'flex'; }
        function closeAdmin() { 
            document.getElementById('adminOverlay').style.display = 'none';
            document.getElementById('adminLogin').classList.remove('hidden');
            document.getElementById('adminConsole').classList.add('hidden');
            document.getElementById('adminKey').value = "";
        }

        function authAdmin() {
            if(document.getElementById('adminKey').value === ADMIN_PWD) {
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminConsole').classList.remove('hidden');
            } else {
                alert("Incorrect Access Key!");
            }
        }

        // --- DATA SYNC ---
        function initApp() {
            // Check connectivity
            document.getElementById('status-bar').classList.remove('hidden');
            
            // Listen for Subjects
            db.collection("subjects").orderBy("name").onSnapshot(snap => {
                const list = document.getElementById('subjectList');
                const select = document.getElementById('subSelect');
                list.innerHTML = `<button onclick="filter('All')" class="w-full text-left p-3 sidebar-item text-sm font-semibold mb-2">📁 All Collections</button>`;
                select.innerHTML = "";
                
                snap.forEach(doc => {
                    const s = doc.data().name;
                    list.innerHTML += `<button onclick="filter('${s}')" class="w-full text-left p-3 sidebar-item text-sm text-slate-500">${s}</button>`;
                    select.innerHTML += `<option value="${s}">${s}</option>`;
                });
                document.getElementById('status-bar').classList.add('hidden');
            }, err => {
                document.getElementById('status-bar').innerText = "Database Error: Please check Firestore Rules.";
                document.getElementById('status-bar').className = "bg-red-600 text-white text-[10px] py-1 text-center font-bold uppercase tracking-widest z-[100]";
            });

            // Listen for Resources
            db.collection("resources").onSnapshot(snap => {
                const list = document.getElementById('resourceList');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const r = doc.data();
                    list.innerHTML += `<a href="${r.url}" target="_blank" class="block p-3 sidebar-item text-sm text-slate-500 italic"><i class="fas fa-external-link-alt mr-2 text-[10px]"></i>${r.name}</a>`;
                });
            });

            loadPapers();
        }

        function loadPapers() {
            db.collection("pdfs").onSnapshot(snap => {
                const container = document.getElementById('libraryView');
                container.innerHTML = "";
                snap.forEach(doc => {
                    const p = doc.data();
                    const id = doc.id;
                    if(currentCategory === "All" || p.category === currentCategory) {
                        container.innerHTML += `
                            <div class="glass-panel p-6 rounded-3xl shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer group relative">
                                <div class="flex flex-col h-full" onclick="openTab('${p.title}', '${p.link}')">
                                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-4 group-hover:bg-indigo-600 group-hover:text-white transition">
                                        <i class="fas fa-file-pdf text-xl"></i>
                                    </div>
                                    <h4 class="font-bold text-slate-800 dark:text-slate-100 mb-1">${p.title}</h4>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${p.category}</p>
                                </div>
                                <button onclick="event.stopPropagation(); deleteItem('pdfs', '${id}')" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>`;
                    }
                });
            });
        }

        function filter(cat) { currentCategory = cat; showLibrary(); loadPapers(); }

        // --- TAB LOGIC ---
        function openTab(title, link) {
            const cleanUrl = link.includes("view") ? link.replace("/view", "/preview") : link;
            if(!openTabs.find(t => t.link === cleanUrl)) {
                openTabs.push({title, link: cleanUrl});
            }
            renderTabs();
            switchTab(cleanUrl);
        }

        function renderTabs() {
            const container = document.getElementById('activeTabs');
            container.innerHTML = "";
            openTabs.forEach(t => {
                const isActive = document.getElementById('pdfFrame').src === t.link;
                container.innerHTML += `
                    <div class="flex items-center gap-2 px-4 py-3 text-sm whitespace-nowrap border-b-2 ${isActive ? 'tab-active' : 'border-transparent text-slate-400'}">
                        <button onclick="switchTab('${t.link}')">${t.title}</button>
                        <button onclick="closeTab('${t.link}')" class="hover:text-red-500 ml-1">&times;</button>
                    </div>`;
            });
        }

        function switchTab(url) {
            document.getElementById('tab-home').classList.remove('tab-active');
            document.getElementById('libraryView').classList.add('hidden');
            document.getElementById('readerView').classList.remove('hidden');
            document.getElementById('pdfFrame').src = url;
            renderTabs();
        }

        function showLibrary() {
            document.getElementById('tab-home').classList.add('tab-active');
            document.getElementById('libraryView').classList.remove('hidden');
            document.getElementById('readerView').classList.add('hidden');
            document.getElementById('pdfFrame').src = "";
            renderTabs();
        }

        function closeTab(url) {
            openTabs = openTabs.filter(t => t.link !== url);
            showLibrary();
        }

        // --- DATABASE WRITES ---
        async function saveSubject() {
            const name = document.getElementById('subInput').value;
            if(name) { await db.collection("subjects").add({name}); document.getElementById('subInput').value = ""; }
        }

        async function savePDF() {
            const title = document.getElementById('pdfName').value;
            const link = document.getElementById('pdfLink').value;
            const category = document.getElementById('subSelect').value;
            if(title && link && category) {
                await db.collection("pdfs").add({title, link, category, date: new Date()});
                alert("Success: Paper added to library.");
                document.getElementById('pdfName').value = "";
                document.getElementById('pdfLink').value = "";
            }
        }

        async function saveResource() {
            const name = document.getElementById('resName').value;
            const url = document.getElementById('resUrl').value;
            if(name && url) { await db.collection("resources").add({name, url}); document.getElementById('resName').value = ""; document.getElementById('resUrl').value = ""; }
        }

        async function deleteItem(coll, id) {
            if(confirm("Are you sure you want to delete this?")) {
                await db.collection(coll).doc(id).delete();
            }
        }

        // Initialize on load
        window.onload = () => {
            if(localStorage.getItem('pg_dark_mode') === 'true') toggleDarkMode();
            initApp();
        };
    </script>
</body>
</html>
